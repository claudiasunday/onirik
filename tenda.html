<!doctype html>
<html lang="ca">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tenda — ONIRIK BOARDS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@200..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/styles.css" />
    <link rel="icon" type="image/png" href="assets/images/favicon.png" />
  </head>
  <body data-page="tenda">
    <div id="site-header"></div>

    <main>
      <section class="page-hero container">
        <span class="eyebrow">🏄 Tenda</span>
        <h1 class="visually-hidden">Taules, packs i edicions especials</h1>
        <p class="lede visually-hidden">
          Edicions limitades ja acabades, packs amb roller de suro inclòs i
          peces d'edició especial. Si prefereixes triar tu la forma, el
          disseny i el color, millor
          <a class="link-underline" href="personalitza.html">personalitza la teva</a>.
        </p>
      </section>

      <section class="container section-tight-top">
        <div class="subnav" role="tablist" aria-label="Filtra per categoria">
          <button type="button" class="active" data-category="all">Totes</button>
          <button type="button" data-category="board">Taules</button>
          <button type="button" data-category="pack">Packs</button>
          <button type="button" data-category="edition">Edicions especials</button>
          <button type="button" data-category="accessori">Accessoris</button>
        </div>
        <div class="shop-toolbar">
          <div class="filters">
            <select id="filter-shape" aria-label="Filtra per forma">
              <option value="all">Totes les formes</option>
              <option value="peix">PEIX</option>
              <option value="lasai">LASAI</option>
              <option value="la-free">LA FREE</option>
              <option value="keki">KEKI</option>
            </select>
            <select id="sort-select" aria-label="Ordena per preu">
              <option value="default">Ordenar per</option>
              <option value="price-asc">Preu: de menys a més</option>
              <option value="price-desc">Preu: de més a menys</option>
            </select>
          </div>
          <span class="shop-count" id="shop-count"></span>
        </div>
        <div class="product-grid" id="shop-grid"></div>
      </section>
    </main>

    <div id="site-footer"></div>

    <script src="assets/js/board.js"></script>
    <script src="assets/js/layout.js"></script>
    <script src="assets/js/cart.js"></script>
    <script src="assets/js/tenda.js"></script>
  </body>
</html>
