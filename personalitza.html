<!doctype html>
<html lang="ca">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Personalitza la teva taula — Onirik Boards</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/styles.css" />
    <link rel="icon" type="image/png" href="assets/images/favicon.png" />
  </head>
  <body data-page="personalitza">
    <div id="site-header"></div>

    <main class="wizard">
      <div class="wizard-top">
        <h1 id="wizard-title">Dissenya la teva taula</h1>
      </div>

      <div class="step-indicator">
        <div class="step-dot" data-step="1" role="button" tabindex="0">
          <span class="num">1</span>
          <span>forma</span>
        </div>
        <div class="step-dot" data-step="2" role="button" tabindex="0">
          <span class="num">2</span>
          <span>disseny</span>
        </div>
        <div class="step-dot" data-step="3" role="button" tabindex="0">
          <span class="num">3</span>
          <span>color</span>
        </div>
      </div>

      <div class="wizard-grid">
        <div class="board-stage">
          <div class="board-preview" id="board-preview"></div>
        </div>

        <div class="option-panel">
          <!-- Pas 1: forma -->
          <div id="panel-shape" class="step-panel step-panel-shape">
            <div class="shape-intro">
              <p class="eyebrow">Tria la forma</p>
              <h2>Quina taula s'adapta a tu?</h2>
            </div>
            <div class="swatch-grid swatch-grid-shapes" id="shape-grid"></div>
            <div class="shape-detail">
              <div class="option-head">
                <h3 id="shape-name">PEIX</h3>
                <span class="tag" id="shape-tag">PRO</span>
              </div>
              <p class="shape-tagline" id="shape-tagline"></p>
              <p class="shape-description" id="shape-description"></p>
              <p class="shape-activities-label">ideal per:</p>
              <div class="activity-row activity-chips" id="shape-activities"></div>
            </div>
            <div class="wizard-actions">
              <button class="btn btn-primary btn-wizard-cta" id="btn-step1">
                <span id="btn-step1-label">Escollir forma</span>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
              </button>
            </div>
          </div>

          <!-- Pas 2: disseny -->
          <div id="panel-design" class="step-panel" hidden>
            <div class="option-head">
              <h2>Tria el disseny</h2>
            </div>
            <div class="swatch-grid" id="design-grid"></div>
            <div class="wizard-actions">
              <button class="btn btn-dark" id="btn-step2" disabled>Tria disseny</button>
            </div>
          </div>

          <!-- Pas 3: color -->
          <div id="panel-color" class="step-panel" hidden>
            <div class="option-head">
              <h2>Tria el color</h2>
            </div>
            <div class="swatch-grid" id="color-grid"></div>
            <div class="wizard-actions">
              <button class="btn btn-dark" id="btn-step3" disabled>Tria el color</button>
            </div>
          </div>

          <!-- Pas 4: resum -->
          <div id="panel-summary" class="step-panel" hidden>
            <div class="option-head">
              <h2>Dissenyat per tu</h2>
            </div>
            <div class="summary-box">
              <div class="row"><span>Forma</span><strong id="sum-shape"></strong></div>
              <div class="row"><span>Disseny</span><strong id="sum-design"></strong></div>
              <div class="row"><span>Color</span><strong id="sum-color"></strong></div>
              <div class="row price"><span>Preu</span><span id="sum-price"></span></div>
            </div>
            <div class="wizard-actions">
              <button class="btn btn-dark" id="btn-add-cart">Afegir a la cistella</button>
              <button class="btn btn-secondary-outline" id="btn-save">Guardar preselecció</button>
            </div>
          </div>
        </div>
      </div>
    </main>

    <div id="site-footer"></div>

    <script src="assets/js/board.js"></script>
    <script src="assets/js/layout.js"></script>
    <script src="assets/js/personalitza.js"></script>
  </body>
</html>
